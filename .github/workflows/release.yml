# Build against the pinned compatible core; publish only on an explicit version tag.
name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # needed to publish a Release

env:
  EXT_NAME: wxl-modern-m2
  CORE_REPO: Furioz420/wxl-core
  CORE_REF: 48b2849ed05d2c66e2ba2a6185e09fafd111da53

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this extension
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout wxl-core (${{ env.CORE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          submodules: recursive
          path: core

      - name: Drop this extension's source into core/extensions/
        shell: pwsh
        run: |
          $dest = "core/extensions/$env:EXT_NAME"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "ext/*" -Destination $dest -Recurse -Force

      - name: Configure (Win32)
        shell: pwsh
        run: cmake -S core -B core/build -A Win32

      - name: Build
        shell: pwsh
        run: cmake --build core/build --config Release --target $env:EXT_NAME --parallel

      - name: Stage the DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "core/build/Release/$env:EXT_NAME.dll" -Destination "dist/$env:EXT_NAME.dll"

      - name: Read the version out of the manifest
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content ext/wxl.json -Raw | ConvertFrom-Json).extension.version
          if (-not $v) { throw "wxl.json carries no extension.version" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v${{ steps.v.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest $expected"
          }

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ env.EXT_NAME }} ${{ steps.v.outputs.version }}
          body: Built from ${{ github.sha }}
          files: dist/${{ env.EXT_NAME }}.dll
