# WarcraftXL modern-M2 feature switches. 1 = enabled, 0 = disabled.
# Removing/disabling the whole extension also disables the native modern-M2 reader.

# Native Retail player-character models, split skeletons, modern geosets and
# body-sheet composition. The WXL test client carries the matching character
# asset/DB2 overlay, so this must remain enabled across build deployments.
WXL_M2_RETAIL_CHARACTERS=1
# Independent Worgen/Gilnean creation preview. Opt in for the staged visual test.
# Gilnean preview choices are not persisted by appearance protocol v1.
WXL_M2_WORGEN_DUAL_PREVIEW=0
# Optional canary scope: race 0 = all recognized races; sex 2 = both.
WXL_M2_RETAIL_CHARACTER_RACE=0
WXL_M2_RETAIL_CHARACTER_SEX=2

# Retail item accessors, body component textures, and equipment presentation.
WXL_M2_RETAIL_ITEMS=1

# 3D collection/appearance overrides. Requires WXL_M2_RETAIL_ITEMS=1.
WXL_M2_COLLECTIONS=1

# Retarget modern collection bind pivots and scale to the active legacy race
# skeleton. Disable only to compare raw Retail geometry placement.
WXL_M2_COLLECTION_RETARGET=1

# Race/gender helm placement corrections for modern equipment models.
WXL_M2_EQUIPMENT_FIXES=1

# Resolve the selected character's retail equipment before WoW performs its
# one-shot body/weapon composition. Disable only for diagnostics.
WXL_M2_GLUE_PREFETCH=1

# Retail spell-model presentation. This is an independent consumer of wxl-db2.
WXL_M2_RETAIL_SPELLS=1

# Diagnostic logging for individual retail item/display resolution.
WXL_M2_RETAIL_ITEM_DETAIL_LOG=0

# Maximum generated body-component texture edge in pixels (64..4096).
WXL_M2_COMPONENT_TEXTURE_MAX_EDGE=512
